name: Test ocserv image

on:
  pull_request:
    paths:
      - docker/Dockerfile
      - docker/entrypoint.sh
      - docker/prepare-context.sh
      - ui/control/Dockerfile
      - .github/workflows/test-ocserv-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    env:
      OCSERV_VERSION: 1.5.0
      SOURCE_URL: https://www.infradead.org/ocserv/download/ocserv-1.5.0.tar.xz
      SOURCE_SHA256: 42ced08958b9576ab134fcb7bdc7f8df5e13214fd147855f99021fedcf0eedbe
      SIGNATURE_URL: https://www.infradead.org/ocserv/download/ocserv-1.5.0.tar.xz.sig
      SIGNING_KEY_URL: https://ocserv.gitlab.io/www/96865171.asc
      SIGNING_KEY_FINGERPRINT: 1F42418905D8206AA754CCDC29EE58B996865171
      BASE_IMAGE: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
      CANDIDATE_IMAGE: ocserv-vps-server:multistage-test
      CONTROL_IMAGE: ocserv-vps-ui-control:server-compatibility-test
      PUBLISHED_IMAGE: ghcr.io/khorevaa/ocserv-vps-server:1.5.0
      REFERENCE_IMAGE: ocserv/ocserv@sha256:22661d3fa5153303e9956a90b7d6663807a32214d8c27caf5650067032096201

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify and prepare ocserv source
        run: |
          bash docker/prepare-context.sh \
            "${SOURCE_URL}" \
            "${SOURCE_SHA256}" \
            "${SIGNATURE_URL}" \
            "${SIGNING_KEY_URL}" \
            "${SIGNING_KEY_FINGERPRINT}" \
            docker/context
          cp docker/entrypoint.sh docker/context/entrypoint.sh

      - name: Build multi-stage image
        run: |
          docker build \
            --file docker/Dockerfile \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "OCSERV_VERSION=${OCSERV_VERSION}" \
            --build-arg "SOURCE_SHA256=${SOURCE_SHA256}" \
            --tag "${CANDIDATE_IMAGE}" \
            docker/context

      - name: Smoke-test runtime stage
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/sbin/ocserv "${CANDIDATE_IMAGE}" --version
          docker run --rm --entrypoint /bin/sh "${CANDIDATE_IMAGE}" -ec '
            ! command -v cc
            ! command -v gcc
            ! command -v make
            ! command -v meson
            ! command -v ninja
            test ! -e /usr/src/ocserv
            test -x /usr/local/bin/occtl
            test -x /usr/local/bin/ocpasswd
            for binary in \
              /usr/local/sbin/ocserv \
              /usr/local/sbin/ocserv-worker \
              /usr/local/bin/occtl \
              /usr/local/bin/ocpasswd; do
              ! ldd "${binary}" | grep -q "not found"
            done
            /usr/local/bin/occtl --help >/dev/null
            /usr/local/bin/ocpasswd --help >/dev/null
            /sbin/tini --version >/dev/null
          '

      - name: Verify UI control image compatibility
        run: |
          docker build \
            --file ui/control/Dockerfile \
            --build-arg "OCSERV_IMAGE=${CANDIDATE_IMAGE}" \
            --build-arg "UI_VERSION=server-compatibility-test" \
            --tag "${CONTROL_IMAGE}" \
            ui/control
          docker run --rm "${CONTROL_IMAGE}" --help

      - name: Compare image sizes
        run: |
          set -euo pipefail
          docker pull "${PUBLISHED_IMAGE}"
          docker pull "${REFERENCE_IMAGE}"
          candidate_size="$(docker image inspect "${CANDIDATE_IMAGE}" --format '{{.Size}}')"
          published_size="$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{.Size}}')"
          candidate_compressed="$(docker save "${CANDIDATE_IMAGE}" | gzip -9 -c | wc -c)"
          reference_compressed="$(docker save "${REFERENCE_IMAGE}" | gzip -9 -c | wc -c)"
          reduction="$((published_size - candidate_size))"
          reduction_percent="$((reduction * 100 / published_size))"
          test "${reduction}" -gt 0
          test "${candidate_compressed}" -lt "${reference_compressed}"
          {
            echo '## ocserv image size'
            echo
            echo '| Image | Uncompressed runtime | Compressed archive |'
            echo '| --- | ---: | ---: |'
            printf '| Published single-stage | %.1f MiB | n/a |\n' "$(awk -v bytes="${published_size}" 'BEGIN {print bytes / 1024 / 1024}')"
            printf '| Alpine + scratch candidate | %.1f MiB | %.1f MiB |\n' \
              "$(awk -v bytes="${candidate_size}" 'BEGIN {print bytes / 1024 / 1024}')" \
              "$(awk -v bytes="${candidate_compressed}" 'BEGIN {print bytes / 1024 / 1024}')"
            printf '| ocserv/ocserv reference | n/a | %.1f MiB |\n' \
              "$(awk -v bytes="${reference_compressed}" 'BEGIN {print bytes / 1024 / 1024}')"
            echo
            echo "Reduction: ${reduction_percent}%"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
