<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Scheduled Maintenance</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#f4f7fb;color:#14213d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#dceaff,transparent 38%),#f4f7fb}
    main{width:min(680px,100%);padding:48px;border:1px solid #d9e2ef;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 24px 60px rgba(30,55,90,.12)}
    .mark{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:#1d4ed8;color:white;font-size:24px;font-weight:800}
    .eyebrow{margin:28px 0 8px;color:#1d4ed8;font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2rem,7vw,3.6rem);line-height:1.04;letter-spacing:-.04em}p{max-width:52ch;color:#52627a;font-size:1.05rem;line-height:1.7}
    .progress{height:7px;margin:32px 0 14px;overflow:hidden;border-radius:99px;background:#e5ebf4}.progress span{display:block;width:72%;height:100%;border-radius:inherit;background:#1d4ed8}
    footer{display:flex;justify-content:space-between;gap:16px;color:#748197;font-size:.85rem}
    @media(prefers-color-scheme:dark){:root{background:#0d1422;color:#edf3ff}body{background:radial-gradient(circle at 20% 10%,#172b54,transparent 38%),#0d1422}main{background:rgba(17,27,45,.94);border-color:#273854}.progress{background:#25334a}p,footer{color:#aebbd0}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <div class="eyebrow">Scheduled maintenance</div>
    <h1>We’ll be back shortly.</h1>
    <p>We are applying routine infrastructure updates to improve reliability and performance. The website will return automatically when the work is complete.</p>
    <div class="progress" aria-hidden="true"><span></span></div>
    <footer><span>Service update in progress</span><span>Please check again later</span></footer>
  </main>
</body>
</html>
